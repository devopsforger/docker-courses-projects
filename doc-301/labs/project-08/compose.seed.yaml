name: doc301-project08
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: taskforge
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ./taskforge/backend
      dockerfile: ../../Dockerfile.faulty
    environment:
      DATABASE_URL: postgresql+psycopg2://taskforge:${POSTGRES_PASSWORD}@db:5432/taskforge
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./taskforge/frontend
    ports:
      - "${LAB_PORT:-8080}:80"
    depends_on:
      - api
volumes:
  pgdata:
